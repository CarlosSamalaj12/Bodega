<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Bodega - Iniciar sesion</title>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <meta name="theme-color" content="#0f172a"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Bodega"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <link rel="icon" type="image/x-icon" href="./pw.ico"/>
  <link rel="shortcut icon" type="image/x-icon" href="./pw.ico"/>
  <link rel="apple-touch-icon" href="./pw.ico"/>
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192x192.png"/>
  <link rel="apple-touch-icon" sizes="512x512" href="./icon-512x512.png"/>
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body class="loginPage">
  <div class="loginWrap">
    <div class="loginCard">
      <div class="loginLogoWrap">
        <img class="loginLogo" src="/imagenes/Oficial_JDL_blanco.png" alt="Logo JDL" />
      </div>
      <div class="loginTitle">BODEGA JARDINES</div>
      <div class="loginAvatarPreviewWrap" id="loginAvatarPreviewWrap">
        <svg id="loginAvatarPlaceholder" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
        </svg>
        <img class="loginAvatarPreviewImg hidden" id="loginUserAvatar" alt="Avatar usuario seleccionado" />
        <div class="loginAvatarPreviewFallback hidden" id="loginUserAvatarFallback">?</div>
      </div>
      <div class="loginSelectedName" id="loginSelectedName">Selecciona tu usuario</div>

      <div class="loginPickHeader">
        <div class="loginPickTitle">Usuarios</div>
        <div class="loginPickCount" id="loginPickCount"></div>
      </div>
      <div class="loginPickSearch">
        <span class="loginPickSearchIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.5-3.5"></path>
          </svg>
        </span>
        <input id="userPick" class="loginPickInput" placeholder="Buscar por nombre..." autocomplete="off"/>
      </div>
      <div id="loginUserGrid" class="loginUserGrid" role="listbox" aria-label="Lista de usuarios">
        <div class="loginUserGridEmpty">Cargando usuarios...</div>
      </div>

      <div class="loginField">
        <span class="loginFieldIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M5 12h14v8H5z"></path>
            <path d="M8 12V9a4 4 0 0 1 8 0v3"></path>
            <circle cx="12" cy="16" r="1.4"></circle>
          </svg>
        </span>
        <input id="pass" class="loginInput" type="password" placeholder="Contrasena" autocomplete="current-password"/>
        <button id="togglePass" class="loginTogglePass" type="button" aria-label="Mostrar contrasena" title="Mostrar/ocultar contrasena">
          <svg class="iconEye" viewBox="0 0 24 24" role="img" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg class="iconEyeOff" viewBox="0 0 24 24" role="img" aria-hidden="true">
            <path d="M3 3l18 18"></path>
            <path d="M10.6 6.1A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a17.6 17.6 0 0 1-3.2 3.9"></path>
            <path d="M6.1 6.2A17.4 17.4 0 0 0 2 12s3.5 6 10 6a10.6 10.6 0 0 0 4.4-1"></path>
            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
          </svg>
        </button>
      </div>

      <button id="btn" class="loginBtn" type="button" disabled>INICIAR SESION</button>
      <div id="msg" class="loginMsg"></div>
    </div>
  </div>

<script>
const $ = s => document.querySelector(s);
const APP_BASE_PATH = (() => {
  const parts = String(location.pathname || "")
    .split("/")
    .filter(Boolean);
  const publicIndex = parts.findIndex((part) => part.toLowerCase() === "public");
  if (publicIndex > 0) {
    return `/${parts.slice(0, publicIndex).join("/")}`;
  }
  if (parts[0] && parts[0].toLowerCase() === "inventarioprincipal") {
    return `/${parts[0]}`;
  }
  return "";
})();
const API_ORIGIN = `${location.origin}${APP_BASE_PATH}`;
const loginUsers = [];
const userOptionsMap = new Map();
let selectedUser = null;
let currentFilter = "";

async function fetchLoginApi(path, init) {
  return fetch(`${API_ORIGIN}${path}`, init);
}

function focusLoginPassword() {
  const pass = $("#pass");
  if (!pass) return;
  requestAnimationFrame(() => {
    pass.focus();
    if (typeof pass.select === "function") pass.select();
  });
}

function getInitials(name) {
  const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return "?";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function setLoginAvatar(avatar, fallbackText) {
  const img = $("#loginUserAvatar");
  const fallback = $("#loginUserAvatarFallback");
  const placeholder = $("#loginAvatarPlaceholder");
  const wrap = $("#loginAvatarPreviewWrap");
  if (!img || !fallback || !wrap) return;
  const hasImage = typeof avatar === "string" && avatar.startsWith("data:image/");
  const hasInitials = !hasImage && typeof fallbackText === "string" && fallbackText.length > 0;
  if (hasImage) {
    img.src = avatar;
    img.classList.remove("hidden");
    fallback.classList.add("hidden");
    if (placeholder) placeholder.style.display = "none";
    wrap.classList.add("hasUser");
  } else if (hasInitials) {
    img.removeAttribute("src");
    img.classList.add("hidden");
    fallback.classList.remove("hidden");
    fallback.textContent = fallbackText;
    if (placeholder) placeholder.style.display = "none";
    wrap.classList.add("hasUser");
  } else {
    img.removeAttribute("src");
    img.classList.add("hidden");
    fallback.classList.add("hidden");
    if (placeholder) placeholder.style.display = "";
    wrap.classList.remove("hasUser");
  }
}

function updateLoginUserCount(visible) {
  const el = $("#loginPickCount");
  if (!el) return;
  if (!loginUsers.length) {
    el.textContent = "";
  } else {
    el.textContent = `${visible}/${loginUsers.length}`;
  }
}

function updateLoginSubmitState() {
  const btn = $("#btn");
  if (!btn) return;
  const hasUser = Boolean(selectedUser);
  const hasPass = Boolean(String($("#pass")?.value || "").trim());
  btn.disabled = !(hasUser && hasPass);
}

async function loadLoginUsers() {
  const grid = $("#loginUserGrid");
  if (!grid) return;
  try {
    const r = await fetchLoginApi(`/api/auth/users`);
    const rows = await r.json().catch(() => []);
    if (!r.ok || !Array.isArray(rows)) {
      grid.innerHTML = `<div class="loginUserGridEmpty">No se pudieron cargar usuarios</div>`;
      return;
    }
    userOptionsMap.clear();
    loginUsers.length = 0;
    rows.forEach((u) => {
      const username = String(u.username || "").trim();
      if (!username) return;
      const item = {
        username,
        full_name: String(u.full_name || ""),
        avatar_url: String(u.avatar_url || ""),
      };
      userOptionsMap.set(username.toLowerCase(), item);
      loginUsers.push(item);
    });
    renderUserGrid();
  } catch {
    grid.innerHTML = `<div class="loginUserGridEmpty">Error de conexion</div>`;
  }
}

function renderUserGrid() {
  const grid = $("#loginUserGrid");
  if (!grid) return;
  const query = currentFilter.toLowerCase().trim();
  const list = loginUsers.filter((u) => {
    if (!query) return true;
    return (
      u.username.toLowerCase().includes(query) ||
      u.full_name.toLowerCase().includes(query)
    );
  });
  updateLoginUserCount(list.length);
  if (!list.length) {
    grid.innerHTML = `<div class="loginUserGridEmpty">Sin resultados</div>`;
    return;
  }
  grid.innerHTML = list
    .map((u) => {
      const init = getInitials(u.full_name || u.username);
      const sel = selectedUser && selectedUser.username === u.username ? "selected" : "";
      const avatarHtml = u.avatar_url
        ? `<img class="loginUserCardAvatar" src="${u.avatar_url}" alt=""/><span class="loginUserCardInitials" style="display:none">${init}</span>`
        : `<span class="loginUserCardInitials">${init}</span>`;
      return `
      <button type="button" class="loginUserCard ${sel}" data-user="${u.username}" role="option" aria-selected="${sel ? "true" : "false"}">
        <div class="loginUserCardAvatarWrap">${avatarHtml}</div>
        <div class="loginUserCardName">${u.full_name || u.username}</div>
        <div class="loginUserCardUser">@${u.username}</div>
      </button>`;
    })
    .join("");
}

function selectLoginUser(username, { focusPassword = true } = {}) {
  const key = String(username || "").trim();
  const found = userOptionsMap.get(key.toLowerCase());
  const selectedName = $("#loginSelectedName");
  if (!found) {
    selectedUser = null;
    setLoginAvatar("", "?");
    if (selectedName) selectedName.textContent = "Selecciona tu usuario";
    updateLoginSubmitState();
    return;
  }
  selectedUser = found;
  setLoginAvatar(found.avatar_url, getInitials(found.full_name || found.username));
  if (selectedName) {
    selectedName.textContent = found.full_name || found.username;
  }
  // Update grid selection state
  document.querySelectorAll(".loginUserCard").forEach((el) => {
    const isSel = el.dataset.user === found.username;
    el.classList.toggle("selected", isSel);
    el.setAttribute("aria-selected", isSel ? "true" : "false");
  });
  if (focusPassword) {
    setTimeout(focusLoginPassword, 60);
  }
  updateLoginSubmitState();
}

$("#btn").onclick = async () => {
  const btn = $("#btn");
  const msg = $("#msg");
  msg.textContent = "";
  msg.className = "loginMsg";

  const username = selectedUser ? selectedUser.username : "";
  const password = $("#pass").value.trim();
  if (!username || !password) {
    msg.textContent = "Selecciona usuario y escribe contrasena";
    msg.className = "loginMsg bad";
    return;
  }

  btn.disabled = true;
  try {
    const r = await fetchLoginApi(`/api/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    const ct = r.headers.get("content-type") || "";
    const j = ct.includes("application/json") ? await r.json() : { error: "Respuesta invalida del servidor API" };

    if (!r.ok) {
      msg.textContent = j.error || "No se pudo iniciar sesion";
      msg.className = "loginMsg bad";
      $("#pass").select();
      return;
    }

    localStorage.setItem("token", j.token);
    localStorage.setItem("me", JSON.stringify(j.user));
    location.href = "/app";
  } catch {
    msg.textContent = "Error de conexion con el servidor";
    msg.className = "loginMsg bad";
  } finally {
    updateLoginSubmitState();
  }
};

// Password show/hide toggle
const toggleBtn = $("#togglePass");
if (toggleBtn) {
  toggleBtn.addEventListener("click", () => {
    const pass = $("#pass");
    if (!pass) return;
    const showing = pass.type === "text";
    pass.type = showing ? "password" : "text";
    toggleBtn.classList.toggle("showing", !showing);
    toggleBtn.setAttribute("aria-label", !showing ? "Ocultar contrasena" : "Mostrar contrasena");
    pass.focus();
  });
}

// Search filter
const userPickInput = $("#userPick");
if (userPickInput) {
  userPickInput.addEventListener("input", (e) => {
    currentFilter = e.target.value || "";
    renderUserGrid();
  });
}

// User grid click handler
const userGrid = $("#loginUserGrid");
if (userGrid) {
  userGrid.addEventListener("click", (e) => {
    const card = e.target.closest(".loginUserCard");
    if (!card) return;
    selectLoginUser(card.dataset.user || "", { focusPassword: true });
  });
}

// Submit on Enter from password field
$("#pass").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !$("#btn").disabled) {
    e.preventDefault();
    $("#btn").click();
  }
});

// Enable/disable submit based on form state
$("#pass").addEventListener("input", updateLoginSubmitState);

setLoginAvatar("", "?");
loadLoginUsers();
</script>
  <div class="connIndicator" id="connIndicator">
    <span class="connDot" id="connDot"></span>
    <span class="connText" id="connText">En l&iacute;nea</span>
  </div>
  <div class="updateBanner hidden" id="updateBanner">
    <span class="updateText">Nueva versi&oacute;n disponible</span>
    <button class="updateBtn" id="updateBtn" type="button">Actualizar</button>
  </div>
<script>
  (function() {
    if (!("serviceWorker" in navigator)) return;
    var swReg = null;
    var waitingSW = null;
    var updateBanner = document.getElementById("updateBanner");
    var updateBtn = document.getElementById("updateBtn");

    function showUpdate() {
      if (updateBanner) updateBanner.classList.remove("hidden");
    }

    function hideUpdate() {
      if (updateBanner) updateBanner.classList.add("hidden");
    }

    if (updateBtn) {
      updateBtn.addEventListener("click", function () {
        hideUpdate();
        if (waitingSW) {
          waitingSW.postMessage({ type: "SKIP_WAITING" });
        } else if (swReg && swReg.waiting) {
          swReg.waiting.postMessage({ type: "SKIP_WAITING" });
        }
      });
    }

    navigator.serviceWorker.addEventListener("controllerchange", function () {
      window.location.reload();
    });

    function onSWStateChange(worker) {
      if (worker.state === "installed" && navigator.serviceWorker.controller) {
        showUpdate();
      }
    }

    function onUpdateFound() {
      var installing = swReg.installing;
      if (!installing) return;
      waitingSW = installing;
      installing.addEventListener("statechange", function () {
        onSWStateChange(installing);
      });
      onSWStateChange(installing);
    }

    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").then(function (reg) {
        swReg = reg;
        waitingSW = reg.waiting;
        if (reg.waiting) {
          showUpdate();
        }
        reg.addEventListener("updatefound", onUpdateFound);
      }).catch(function (err) {
        console.error("SW registration failed:", err);
      });
    });
  })();
</script>
<script>
  // Capture beforeinstallprompt early so app.html can use it.
  // Some browsers only fire it on the first page; capture in sessionStorage.
  (function() {
    if (!('serviceWorker' in navigator)) return;
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    if (isStandalone) return;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      try { window.__deferredInstallPrompt = e; } catch (_) {}
    });
  })();
</script>
<script>
  (function() {
    var indicator = document.getElementById("connIndicator");
    var dot = document.getElementById("connDot");
    var text = document.getElementById("connText");
    if (!indicator) return;

    function updateConn(online) {
      if (online) {
        indicator.classList.remove("offline");
        indicator.classList.add("online");
        if (dot) dot.className = "connDot on";
        if (text) text.textContent = "En l\u00ednea";
      } else {
        indicator.classList.remove("online");
        indicator.classList.add("offline");
        if (dot) dot.className = "connDot off";
        if (text) text.textContent = "Sin conexi\u00f3n";
      }
    }

    updateConn(navigator.onLine);

    window.addEventListener("online", function () { updateConn(true); });
    window.addEventListener("offline", function () { updateConn(false); });
  })();
</script>
</body>
</html>
